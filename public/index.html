<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dang nhap - Safe Exam</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand-title">Safe Exam</div>
  </header>

  <main class="container container-narrow" style="padding-top: 40px;">
    <div class="card" style="padding: 28px;">
      <h2 style="margin-bottom: 6px; text-align: center;">He thong Kiem tra Truc tuyen</h2>
      <p style="margin-bottom: 24px; text-align: center; color: var(--text-muted); font-size: 0.9rem;">
        Nhap ten tai khoan de tiep tuc dang nhap vao he thong.
      </p>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="username">Ten tai khoan</label>
          <input 
            type="text" 
            id="username" 
            class="form-control" 
            placeholder="Vi du: nguyenvana, emtrai, admin..." 
            autocomplete="username" 
            required 
            autofocus
          >
        </div>

        <!-- O nhap mat khau: Chi hien thi khi la admin o buoc 2 -->
        <div id="passwordGroup" class="form-group" style="display: none; margin-top: 16px;">
          <label class="form-label" for="password">Mat khau quan tri</label>
          <input 
            type="password" 
            id="password" 
            class="form-control" 
            placeholder="Nhap mat khau quan tri vien..." 
            autocomplete="current-password"
          >
          <small style="color: var(--text-muted); font-size: 0.8rem; display: block; margin-top: 4px;">
            Nhan dien tai khoan Quan tri vien (Admin). Vui long nhap mat khau de xac thuc.
          </small>
        </div>

        <div id="loginErrorBox" class="alert-box alert-danger" style="display: none; padding: 10px; font-size: 0.85rem; margin-top: 14px; margin-bottom: 6px;"></div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-block" style="padding: 13px; margin-top: 16px; font-size: 1rem;">
          Dang nhap
        </button>
      </form>
    </div>
  </main>

  <script>
    const usernameInput = document.getElementById('username');
    const passwordGroup = document.getElementById('passwordGroup');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const errorBox = document.getElementById('loginErrorBox');

    let currentStep = 'user'; // 'user' | 'admin'

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }

    function hideError() {
      errorBox.textContent = '';
      errorBox.style.display = 'none';
    }

    // Neu sua o tai khoan khi dang o step admin -> reset ve step user
    usernameInput.addEventListener('input', () => {
      hideError();
      if (currentStep === 'admin') {
        currentStep = 'user';
        passwordGroup.style.display = 'none';
        passwordInput.value = '';
      }
    });

    async function handleLogin(e) {
      e.preventDefault();
      hideError();

      const user = usernameInput.value.trim();
      if (!user) {
        showError('Vui long nhap ten tai khoan!');
        usernameInput.focus();
        return;
      }

      // Buoc 1: Kiem tra ten tai khoan
      if (currentStep === 'user') {
        if (user.toLowerCase() === 'admin') {
          currentStep = 'admin';
          passwordGroup.style.display = 'block';
          passwordInput.value = '';
          passwordInput.focus();
          return;
        }

        // Thi sinh vao thang phong thi
        window.location.href = `exam.html?user=${encodeURIComponent(user)}`;
        return;
      }

      // Buoc 2: Xac thuc mat khau admin
      if (currentStep === 'admin') {
        const pass = passwordInput.value.trim();
        if (!pass) {
          showError('Vui long nhap mat khau quan tri vien!');
          passwordInput.focus();
          return;
        }

        // Mat khau chi server biet (bien moi truong ADMIN_PASSWORD); server tra token co han 12 gio
        try {
          const res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pass })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'Khong dang nhap duoc (' + res.status + ')');
          sessionStorage.setItem('safe_exam_admin_token', data.token);
          window.location.href = 'admin.html';
        } catch (err) {
          showError(err.message);
          passwordInput.value = '';
          passwordInput.focus();
        }
      }
    }
  </script>
</body>
</html>
