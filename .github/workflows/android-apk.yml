# Build app Android (file .apk) tren GitHub, khong can Android Studio tren may.
# File cai dat co link co dinh:
#   https://github.com/DuNhatAnh/safe-seb/releases/download/apk-latest/safe-exam.apk
# Dia chi he thong thi trong app: bien SAFE_EXAM_URL (GitHub > Settings > Secrets and variables > Actions > Variables),
# khong dat thi dung safeExamUrl trong android/gradle.properties.
name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "VERSION"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      # Phien ban = file VERSION; so ban build = so lan chay workflow (tu tang)
      - name: Phien ban
        id: ver
        run: echo "name=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: android
        env:
          SAFE_EXAM_URL: ${{ vars.SAFE_EXAM_URL }}
        run: |
          ARGS="-PappVersionCode=${{ github.run_number }}"
          if [ -n "$SAFE_EXAM_URL" ]; then ARGS="$ARGS -PsafeExamUrl=$SAFE_EXAM_URL"; fi
          gradle assembleDebug --no-daemon $ARGS
          cp app/build/outputs/apk/debug/app-debug.apk ../safe-exam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: safe-exam-apk
          path: safe-exam.apk

      - name: Dang len link tai co dinh (release "apk-latest")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Safe Exam v${{ steps.ver.outputs.name }} (bản ${{ github.run_number }})"
          body: |
            Phiên bản ${{ steps.ver.outputs.name }} · bản build ${{ github.run_number }} · commit ${{ github.sha }}
            Tải safe-exam.apk về điện thoại Android, cài đặt, mở app. Cuối trang đăng nhập hiện "App ${{ steps.ver.outputs.name }} (bản ${{ github.run_number }})".
            Cài bản mới: gỡ app Safe Exam cũ trước rồi cài.
          files: safe-exam.apk
          overwrite_files: true
          make_latest: true
